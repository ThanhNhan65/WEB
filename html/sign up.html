<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký</title>
    <link rel="stylesheet" href="signup-style.css">
</head>
<body>
    <div class="container">
        <h1>ĐĂNG KÝ</h1>
        
        <div class="success" id="successMsg">✓ Đăng ký thành công!</div>
        
        <form id="signupForm">
    
            <label>Email <span class="required">*</span></label>
            <input type="email" id="email" placeholder="Nhập email của bạn" required>

            
            <label>Mật khẩu <span class="required">*</span></label>
            <input type="password" id="password" placeholder="Nhập mật khẩu" required>

           
            <label>Xác nhận lại mật khẩu <span class="required">*</span></label>
            <input type="password" id="confirmPassword" placeholder="Nhập mật khẩu" required>
            
            
            <div class="error" id="errorMsg">Mật khẩu không khớp!</div>

        
            <button type="submit">Đăng ký</button>
        </form>
    </div>


    <script src="signup-script.js"></script>
</body>
</html>
