<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Khách hàng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">WATCH</div>
        <input type="text" class="search-box" id="searchBox" placeholder="Tìm kiếm...">
    </header>

    <div class="tabs">
        <div class="tab active">Khách hàng</div>
    </div>

    <div class="container">
        <div class="header-section">
            <h1>Danh sách Khách hàng</h1>
            <button class="btn-add" onclick="openAddModal()">+ Thêm</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên</th>
                    <th>Email</th>
                    <th>SĐT</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="customerTableBody">
                
            </tbody>
        </table>
    </div>

    
    <div id="customerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Thêm Khách hàng</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="customerForm" onsubmit="saveCustomer(event)">
                <input type="hidden" id="customerId">
                
                <div class="form-group">
                    <label for="customerName">Tên khách hàng <span class="required">*</span></label>
                    <input type="text" id="customerName" required>
                </div>

                <div class="form-group">
                    <label for="customerEmail">Email <span class="required">*</span></label>
                    <input type="email" id="customerEmail" required>
                </div>

                <div class="form-group">
                    <label for="customerPhone">Số điện thoại <span class="required">*</span></label>
                    <input type="tel" id="customerPhone" pattern="[0-9]{10}" required>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="btn-save">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
