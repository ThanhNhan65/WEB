<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/headerfooter.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Sansita:ital,wght@0,400;0,700;0,800;0,900;1,400;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@100;200;300;400&display=swap" rel="stylesheet">
     
</head>

<body>
    <div class="wrapper">
        <!-- Header -->
        <div class="header">
            <h3 class="watch-title">WATCH</h3>
            <div class="right-header">
                <div class="login-register">
                    <a href="#!">Đăng ký</a><a href="#!">Đăng nhập</a>
                </div>
                <div class="search-cart-group">
                    <div class="search-bar">
                        <div class="search">
                            <input type="text" placeholder="Tìm kiếm...">
                        </div>  
                        <div class="search-icon">
                            <a href="#!"><i class="fa-solid fa-magnifying-glass"></i></a>
                        </div>
                    </div>
                    <div class="cart-icon">
                        <a href="#!">
                            <i class="fa-solid fa-cart-shopping" style="color: #fff;"></i>
                        </a>
                    </div>
                </div>
                
            </div>
        </div>

        <!-- Body -->
        <div class="body">
            <div class="menu">
                <a href="#!">Trang chủ</a>
                <a href="#!">Thương hiệu</a>
                <a href="#!">Sản phẩm</a>
            </div>

            <h1 class="cart-title">Giỏ hàng</h1>


            <div class="cart-list">   
                <table>
                    <thead>
                        <tr>
                            <th colspan="2">Sản phẩm</th>
                            <th>Giá</th>
                            <th>Số lượng</th>
                            <th>Thành tiền</th>
                            <th>Xóa</th>
                        </tr>
                    </thead>
                    <tbody>
                    <tr>
                            <td><img src="" alt=""></td>
                            <td class="product">G-Shock GM-110-1A</td>
                            <td class="price" data-price="5000000">5,000,000đ</td>
                            <td>
                                <button class="decrease">-</button>
                                <input type="number" class="quantity" value="1" min="1">
                                <button class="increase">+</button>
                            </td>
                            <td class="subtotal">5,000,000đ</td>
                            <td><button class="remove">Xóa</button></td>
                        </tr> 

                        <tr>
                            <td><img src="" alt=""></td>
                            <td class="product">Casio MTP-V002D</td>
                            <td class="price" data-price="2400000">2,400,000đ</td>
                            <td>
                                <button class="decrease">-</button>
                                <input type="number" class="quantity" value="1" min="1">
                                <button class="increase">+</button>
                            </td>
                            <td class="subtotal">2,400,000đ</td>
                            <td><button class="remove">Xóa</button></td>
                        </tr>
                    </tbody>
                </table>

                <div class="cart-footer">
                    <div class="total-price"><b>Tổng tiền:</b> 7,400,000đ</div>
                    <div class="cart-button">
                        <button class="cont-buy">Tiếp tục mua hàng</button>
                        <button class="checkout">Thanh toán</button>
                    </div>
                </div>
            </div>
            
            <!-- <h2 class="cart-empty">Giỏ hàng của bạn đang trống</h2>

            <button class="cont-buy">Tiếp tục mua hàng</button> -->
                
            </div>
        </div>


        <!-- Footer -->
        <div class="footer">
            <div class="title">
                <h3>WATCH</h3>
            </div>
        
            <div class="info-contact">
                <div class="address">
                <h4>Địa chỉ</h4>
                <p></p>
                <p></p>
                <p></p>
                </div>

                <div class="contact">
                <h4>Liên hệ</h4>    
                <p>Email: @gmail.com</p>
                <p>Tel: +84 999 999 999</p>
            </div>
        </div>
    </div>
</body>
</html>
