<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký</title>
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>
    <div class="container">
        <h1>ĐĂNG KÝ</h1>
        <form id="register-form">
            <label>Họ và tên</label>
            <input type="text" name="name" placeholder="Nhập họ và tên">

            <label>Email <span class="required">*</span></label>
            <input type="email" name="email" placeholder="Nhập email của bạn" required>

            <label>Số điện thoại (dùng để đăng nhập)</label>
            <input type="text" name="phone" placeholder="Nhập số điện thoại của bạn">

            <label>Địa chỉ</label>
            <input type="text" name="address" placeholder="Nhập địa chỉ (không bắt buộc)">

            <label>Mật khẩu <span class="required">*</span></label>
            <input type="password" name="password" placeholder="Nhập mật khẩu" required>

            <label>Xác nhận lại mật khẩu</label>
            <input type="password" name="confirm" placeholder="Nhập lại mật khẩu">

            <button type="submit">Đăng ký</button>
        </form>
        <div class="auth-switch">Đã có tài khoản? <a href="login.html">Đăng nhập</a></div>
    </div>
</body>
<script src="js/auth.js"></script>
</html>
