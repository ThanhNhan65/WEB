<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu - WATCH</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="container fade-up">
    <div class="login-form">
      <h1 class="form-title">Quên mật khẩu</h1>
      <form id="forgot-form">
        <div class="form-group">
          <label for="identifier">Email hoặc số điện thoại</label>
          <input 
            type="text" 
            id="identifier" 
            name="identifier" 
            placeholder="Nhập email hoặc số điện thoại"
            required
          >
        </div>

        <div class="form-group">
          <label for="newPassword">Mật khẩu mới</label>
          <input 
            type="password" 
            id="newPassword" 
            name="newPassword" 
            placeholder="Nhập mật khẩu mới"
            required
          >
        </div>

        <button type="submit" class="register-btn">Đặt lại mật khẩu</button>
      </form>

      <div class="auth-switch">
        Nhớ mật khẩu? <a href="login.html">Đăng nhập</a>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
