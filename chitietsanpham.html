<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý bán đồng hồ</title>
  
  <link rel="stylesheet" href="css/headerfooter.css">
  <link rel="stylesheet" href="css/chitietsp.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Sansita:wght@400;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

</head>

<body>
    <div class="wrapper">
        <div class="header">
            <h3 class="watch-title">WATCH</h3>
            <div class="right-header">
                <div class="login-register">
                    <span id="auth-user" class="greeting"></span>
                    <a id="btn-register" href="sign up.html">Đăng ký</a>
                    <a id="btn-login" href="login.html">Đăng nhập</a>
                    <a id="btn-logout" href="#!">Đăng xuất</a>
                </div>
                <div class="search-cart-group">
                    <div class="search-bar">
                        <div class="search">
                            <input type="text" placeholder="Tìm kiếm...">
                        </div>  
                        <div class="search-icon">
                            <a href="products.html"><i class="fa-solid fa-magnifying-glass"></i></a>
                        </div>
                    </div>
                    <div class="cart-icon">
                        <a href="GioHang.html">   
                            <i class="fa-solid fa-cart-shopping text-white"></i>
                        </a>
                    </div>
                    <div class="user-menu" id="user-menu">
                        <button type="button" class="user-menu-btn" id="account-btn" aria-haspopup="true" aria-expanded="false" title="Tài khoản">
                            <i class="fa-solid fa-user"></i>
                        </button>
                        <div class="user-dropdown" id="account-dropdown" role="menu">
                            <ul>
                                <li><a href="hosonguoidung.html" id="profile-link">Hồ sơ người dùng</a></li>
                                <li><a href="lichsumuahang.html" id="orders-link">Lịch sử mua hàng</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!-- Body -->
        <main class="body">
            <!--Menu-->
            <div class="navigation">
                <ul>
                    <li><a href="index.html">Trang chủ</a></li>
                    <li><a href="products.html">Sản phẩm</a></li>
                </ul>
            </div>

            <!--Content-->
            <div class="name fade-up" id="product-name"></div> 
            <div class="product-container fade-up">

                <div class="img-border" id="product-image"></div>
                
                <div>
                    <div class="info-position">
                        <h2>Thông tin cơ bản</h2>
                        <h2 class="h2"><hr></h2>
                        <table id="product-info">
                        </table> 
                    </div>

                    <div class="price">
                        <div class="text1">Giá sản phẩm:</div>
                        <div class="text2" id="product-price"></div>
                    </div>

                    <div class="display-button">
                        <a href="#!" class="button button-left">
                            <p class="text-button">Mua ngay</p>
                        </a>
                        <a href="#!" class="button button-right">
                            <p class="text-button">Thêm vào giỏ hàng</p>
                        </a>
                    </div>
                </div>
            </div>
            <div class="banner">
                <img src="image/banner.png" class="banner-img">
            </div>
        </main>

        <!-- Footer -->
        <div class="footer">
            <div class="title">
                <h3>WATCH</h3>
            </div>
        
            <div class="info-contact">
                <div class="address">
                <h4>Địa chỉ</h4>
                <p>Thanh Hóa</p>
                <p>Cao Bằng</p>
                <p>120 Yên Lãng</p>
                </div>

                <div class="contact">
                <h4>Liên hệ</h4>    
                <p>Email: watch1234@gmail.com</p>
                <p>Tel: +84 999 999 999</p>
            </div>
        </div>
    </div>
<script src="js/auth.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/product-detail.js"></script>
<script src="js/search.js"></script>
</body>
</html>
