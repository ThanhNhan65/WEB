<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - WATCH</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container fade-up">
        <div class="login-form">
            <h1 class="form-title">Đăng nhập</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email hoặc số điện thoại</label>
                    <input 
                        type="text" 
                        id="email" 
                        name="email" 
                        placeholder="Nhập email hoặc số điện thoại"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Nhập mật khẩu của bạn"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="register-btn">Đăng nhập</button>
            </form>
            <div class="auth-switch">Chưa có tài khoản? <a href="sign up.html">Đăng ký</a></div>
        </div>
    </div>
</body>
<script src="js/auth.js"></script>
</html>
