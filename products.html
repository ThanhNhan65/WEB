<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm</title>
    <link rel="stylesheet" href="css/headerfooter.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/tatcasanpham.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Sansita:wght@400;700;800;900&display=swap" rel="stylesheet">

</head>

<body>
    <div class="wrapper">
        <div class="header">
            <h3 class="watch-title">WATCH</h3>
            <div class="right-header">
                <div class="login-register">
                    <span id="auth-user" class="greeting"></span>
                    <a id="btn-register" href="sign up.html">Đăng ký</a>
                    <a id="btn-login" href="login.html">Đăng nhập</a>
                    <a id="btn-logout" href="#!">Đăng xuất</a>
                </div>
                <div class="search-cart-group">
                    <div class="search-bar">
                        <div class="search">
                            <input type="text" placeholder="Tìm kiếm...">
                        </div>  
                        <div class="search-icon">
                            <a href="products.html"><i class="fa-solid fa-magnifying-glass"></i></a>
                        </div>
                    </div>
                    <div class="cart-icon">
                        <a href="GioHang.html">   
                            <i class="fa-solid fa-cart-shopping" style="color: #fff;"></i>
                        </a>
                    </div>
                    <div class="user-menu" id="user-menu">
                        <button type="button" class="user-menu-btn" id="account-btn" aria-haspopup="true" aria-expanded="false" title="Tài khoản">
                            <i class="fa-solid fa-user"></i>
                        </button>
                        <div class="user-dropdown" id="account-dropdown" role="menu">
                            <ul>
                                <li><a href="hosonguoidung.html" id="profile-link">Hồ sơ người dùng</a></li>
                                <li><a href="lichsumuahang.html" id="orders-link">Lịch sử mua hàng</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <div class="body">
            <div class="navigation">
                <ul>
                    <li><a href="index.html">Trang chủ</a></li>
                    <li><a href="products.html">Sản phẩm</a></li>
                </ul>
            </div>

            <h4 id="all-products-title" class="fade-up">Tìm kiếm sản phẩm</h4>

            <form id="search-form" class="search-advanced fade-up" onsubmit="return false;" aria-label="Tìm kiếm nâng cao">
                <div class="row">
                    <label class="field">
                        <span class="lbl">Từ khóa</span>
                        <input id="q" type="text" placeholder="Nhập tên sản phẩm..." />
                    </label>
                    <label class="field">
                        <span class="lbl">Loại</span>
                        <select id="type">
                            <option value="">Tất cả</option>
                            <option value="Dien tu">Điện tử</option>
                            <option value="Kim">Kim</option>
                            <option value="Unisex">Unisex</option>
                        </select>
                    </label>
                    <label class="field">
                        <span class="lbl">Giá từ</span>
                        <input id="priceMin" type="number" min="0" step="1000" placeholder="0" />
                    </label>
                    <label class="field">
                        <span class="lbl">Đến</span>
                        <input id="priceMax" type="number" min="0" step="1000" placeholder="" />
                    </label>
                    <div class="actions">
                        <button id="btnSearch" type="button"><i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm</button>
                    </div>
                </div>
            </form>

            <div class="all-products-wrapper fade-up">
                <div class="product-list" id="product-list"></div>
                <div class="pagination" id="pagination">
                    <div class="button-page prev">prev</div>
                    <div class="index active">1</div>
                    <div class="index">2</div>
                    <div class="button-page next">next</div>
                </div>
            </div>
        </div>

        

    </div>
    <div class="footer">
        <div class="title">
            <h3>WATCH</h3>
        </div>
        <div class="info-contact">
            <div class="address">
                <h4>Địa chỉ</h4>
                <p>Thanh Hóa</p>
                <p>Cao Bằng</p>
                <p>120 Yên Lãng</p>
            </div>
            <div class="contact">
                <h4>Liên hệ</h4>
                <p>Email: watch1234@gmail.com</p>
                <p>Tel: +84 999 999 999</p>
            </div>
        </div>
     </div>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/search.js"></script>
    </body>

</html>
